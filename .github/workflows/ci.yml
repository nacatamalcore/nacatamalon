name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run still going pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      # Builds the package, installs it in an empty project and compiles the README's and
      # llms.txt's games against it, on this repo's TypeScript and on 5.4.
      - name: Package
        run: bun run check:package
